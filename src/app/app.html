<div class="flashcard-container">
  <h1 style="margin-bottom: 12px">{{ title() }}</h1>

  <img style="display: block; margin: 0 auto 32px; width: 80px" src="/assets/angular_gradient.png" alt="">

  @if (!isLoaded()) {
    <div class="loading">
      <p>Loading flashcards...</p>
    </div>
  } @else {
    @if (currentCard(); as card) {
      <div class="flashcard-wrapper">
        <div class="flashcard" [class.flipped]="isFlipped()">
          <div class="flashcard-front">
            <div class="card-content">
              <h2>Question</h2>
              <p>{{ card.question }}</p>
            </div>
          </div>

          <div class="flashcard-back">
            <div class="card-content">
              <h2>Answer</h2>
              <p>{{ card.answer }}</p>
            </div>
          </div>
        </div>

        <div class="buttons-container">
          @if (!showButtons()) {
            <button
              class="difficulty-btn reveal-btn"
              (click)="onDifficultySelect(Difficulty.Medium)">
              Show Answer
            </button>
          } @else {
            <button
              class="difficulty-btn easy"
              (click)="onDifficultySelect(Difficulty.Easy)">
              Easy
            </button>
            <button
              class="difficulty-btn medium"
              (click)="onDifficultySelect(Difficulty.Medium)">
              Medium
            </button>
            <button
              class="difficulty-btn hard"
              (click)="onDifficultySelect(Difficulty.Hard)">
              Hard
            </button>
          }
        </div>

      </div>
    } @else {
      <div class="no-cards">
        <p>No flashcards available!</p>
      </div>
    }
  }
</div>
